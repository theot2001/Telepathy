<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telepathy Tuition | Founded by Twins. Driven by Shared Understanding.</title>
    <meta name="description" content="KS2, KS3, and KS4 Maths and Science tuition founded by identical twins—a qualified teacher and specialist tutor with 20 years of combined experience.">
    <style>
        :root {
            --bg-base: #070d19;
            --bg-surface: #0f172a;
            --bg-card: #131f38;
            --bg-card-hover: #182746;
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-glow: rgba(56, 189, 248, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-teal: #2dd4bf;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.65;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(45, 212, 191, 0.06) 0%, transparent 40%);
        }

        /* Navigation Header */
        header {
            background: rgba(7, 13, 25, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.95rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .brand-tagline-mini {
            font-size: 0.72rem;
            color: var(--accent-teal);
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1.75rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.92rem;
            transition: color 0.2s ease;
            cursor: pointer;
            padding: 0.25rem 0;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: var(--text-primary);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-teal));
            border-radius: 2px;
        }

        nav a.nav-login-btn {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.45rem 1.05rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        nav a.nav-login-btn::after {
            display: none;
        }

        nav a.nav-login-btn:hover, nav a.nav-login-btn.active {
            background: var(--accent-blue);
            color: #070d19;
            border-color: var(--accent-blue);
        }

        /* Main Container & Page Sections */
        main {
            flex: 1;
        }

        .page-section {
            display: none;
            padding: 3.5rem 5%;
            max-width: 1120px;
            margin: 0 auto;
            animation: fadeIn 0.25s ease-out;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4.5rem 1.75rem;
            background: linear-gradient(160deg, rgba(19, 31, 56, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), rgba(45, 212, 191, 0.5), transparent);
        }

            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(15, 23, 42, 0.8);
